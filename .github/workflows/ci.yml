name: CI

on:
  pull_request:
  push:
    branches:
      - master

env:
  RUSTFLAGS: -Dwarnings
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0 # makes cache smaller
  CARGO_PROFILE_DEV_DEBUG: 0

jobs:
  clippy:
    name: Clippy and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: 'recursive'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Check format
        run: cargo fmt -- --check
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: index-${{ hashFiles('Cargo.toml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
      - name: Fetch dependencies
        run: cargo fetch
      - name: Cache target directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: clippy-${{ hashFiles('Cargo.lock') }}
          path: target
      - name: Run clippy
        run: cargo clippy --all --all-targets --target-dir=target
      - name: Run clippy on integration tests
        run: cargo clippy --all --all-targets --features=integration_test --target-dir=target
      - name: Run clippy on C API
        run: cargo clippy --all-targets --manifest-path=c-api/Cargo.toml --target-dir=target
      - name: Run clippy on JS API
        run: cargo clippy --all-targets --manifest-path=js-api/Cargo.toml --target-dir=target
      - name: Check docs
        run: cargo doc --no-deps --all --target-dir=target
      - name: Check semver
        # Compares against the crates.io release of the same version; the
        # bun branch deliberately carries API additions (suspension) on top
        # of it and is never published, so this only makes sense upstream.
        if: github.repository == 'cloudflare/lol-html'
        uses: obi1kenobi/cargo-semver-checks-action@6b69fcf40e9b5fb17adeb57e4b6ecd020649a239 # v2.9
        with:
          package: lol_html
          feature-group: default-features
          verbose: true
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          submodules: 'recursive'
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: index-${{ hashFiles('Cargo.toml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
      - name: Fetch dependencies
        run: cargo fetch
      - name: Cache target directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          key: target-${{ hashFiles('Cargo.lock') }}
          path: target
      - name: Run Rust tests
        run: scripts/test.sh
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      - name: wasm-pack install
        run: npm i -g wasm-pack
      - name: Run JS tests
        run: make -C js-api test
