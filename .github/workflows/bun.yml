name: bun

# Runs the crate's own test suite against the `bun` branch. Upstream's
# `ci.yml` only triggers on `master`; this file is additive so rebasing the
# fork onto a new upstream tag does not have to re-edit `ci.yml`.
on:
  push:
    branches:
      - bun
  pull_request:
    branches:
      - bun

env:
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          submodules: recursive
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Cache cargo registry
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: index-${{ hashFiles('Cargo.toml') }}
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
      - name: Fetch dependencies
        run: cargo fetch
      - name: Cache target directory
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          key: target-bun-${{ hashFiles('Cargo.lock') }}
          path: target
      - name: Run tests
        run: cargo test --features=integration_test --target-dir=target
